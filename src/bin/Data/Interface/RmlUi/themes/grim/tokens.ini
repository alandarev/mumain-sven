; Black Glass palette for Grim. Loaded through the existing token(name) mechanism.
; Neutral chrome changes; item rarity, class/buff colours and wealth tiers remain native.
[Tokens]

; Text and chrome roles; native model colours still take precedence.
text-primary=#eeeae3
text-secondary=#c7cdd1
text-label=#d1d7da
text-muted=#a4afb7
text-dim=#bcc5cb
text-disabled=#747e85
text-inactive=#aaaaaa
text-heading=#e6d3ac
text-title=#f0e5cf

; Content-tier text -- narrative/prompt are two different exact "warm pale body text" shades used
; by two different dialog families (NPC dialogue/quest windows vs. the generic confirm/menu
; dialogs); info/notice/hover/selected are smaller shared UI-state text colors. surface-hover is the
; answer-row hover highlight shared by npc_dialogue/quest_progress's own answer-list rows.
text-narrative=#ffe6d2
text-prompt=#ffe0a0
text-info=#d2e6ff
text-notice=#f7ce4d
text-hint=#ffdc96
text-hover=#ffe3a8
text-selected=#ffcc1a
surface-hover=#b7c7d13d

; Accent -- three distinct accent families already exist in legacy, each reused within its own
; window family: a warm gold (login/remember-password/window_shell/generic_confirm_dialog), a
; cooler blue-title used only by the shop-family windows (my_shop/purchase_shop), and two bright
; cyan/teal accents each shared by a pair of sibling quest/NPC windows. Kept separate, not
; force-unified into one "accent" value.
accent-gold=#ffd23c
accent-blue=#49b0ff
accent-cyan=#96fff0
accent-teal=#24f2fc

; Semantic -- from generic_confirm_dialog's own .warning/.error classes. Only one call site each
; today, but the class names themselves declare a reusable state, not a one-off decorative choice.
semantic-warning=#ffb040
semantic-danger=#ff4040

; Surfaces -- surface-tooltip is BY FAR the most-reused value in this theme (15 occurrences): the
; shared ".tooltip"/"#tooltip_panel" dark backing every window's tooltip uses. surface-backdrop is
; base.rcss's shared #backdrop (every modal-style window). surface-overlay is the character-creation
; flow's own dim panel. surface-panel-title/-content are docked_panel_frame.rcss's shared group-box
; fill tiers (same 7-window reach as text-heading above).
surface-tooltip=#080a0cf5
surface-backdrop=rgba(0, 0, 0, 128)
surface-overlay=rgba(0, 0, 0, 143)
surface-panel-title=#20272df5
surface-panel-content=#080a0cee

; Controls -- shared scrollbar track/thumb colors (3 files: generic_confirm_dialog,
; generic_menu_dialog, option_window) plus their paired well border (border-inner, reusing
; modern's own name for this exact concept -- "a RECESSED content-well edge"). border-control/
; surface-control/text-input are option_window's own internal input-control family (slider/
; dropdown), reused across several of its own controls but not found elsewhere -- kept as their
; own tokens (not merged with surface-recessed/border-inner) since the literal values differ.
; surface-control also reuses modern's name for this concept (a general interactive-control
; surface); border-control has no equally-fitting modern name (modern's border-frame is far
; broader-reaching than legacy's own control-only usage here) so it keeps its own legacy-scoped
; name rather than overclaiming generality.
surface-recessed=#080b0e
surface-control=#10161b
control-thumb=#4a4a45
control-thumb-hover=#6e6e66
border-inner=#39444d
border-control=#58656f
text-input=#eeeae3

; Radius -- deliberately unitless, same convention modern's tokens.ini uses: a call site appends
; its own dp/px (token(radius-sm)dp or token(radius-sm)px). The one radius value actually reused
; across this theme (13 occurrences, all the shared ".tooltip"-family corner rounding).
radius-sm=3

; Typography -- both "DejaVu Sans", the native text renderer's default family (BundledFonts.h), so
; legacy RmlUi text matches the original client's glyph shapes and widths. Same title/body naming
; split modern's tokens.ini uses, so a future asset swap is a one-line change.
font-title=DejaVu Sans
font-body=DejaVu Sans

; Grim HUD materials (do not change gameplay-semantic colours).
grim-stone=#090b0c
grim-bronze=#80603a
grim-bronze-dark=#493721
grim-ivory=#f5ead5
grim-gold=#ecd19b
